syntax = "proto3";

package bookstore.v1;

option go_package = "github.com/thinhnguyenwilliam/book-store/backend/gen/bookstore/v1;bookstorev1";

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc LoginWithGoogle(GoogleLoginRequest) returns (AuthResponse);
  rpc LoginWithFacebook(FacebookLoginRequest) returns (AuthResponse);
  rpc Refresh(RefreshRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message GoogleLoginRequest {
  string credential = 1;
  bool create_account = 2;
  string nonce = 3;
}

message FacebookLoginRequest {
  string access_token = 1;
  bool create_account = 2;
}

message AuthResponse {
  string access_token = 1;
  string user_id = 2;
  int64 expires_in = 3;
  string refresh_token = 4;
  int64 refresh_expires_in = 5;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message DeleteAccountRequest {
  string id = 1;
}

message DeleteAccountResponse {}

message VerifyTokenRequest {
  string access_token = 1;
}

message VerifyTokenResponse {
  string user_id = 1;
  string email = 2;
  repeated string roles = 3;
}
