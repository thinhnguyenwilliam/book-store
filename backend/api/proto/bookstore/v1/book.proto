syntax = "proto3";

package bookstore.v1;

option go_package = "github.com/thinhnguyenwilliam/book-store/backend/gen/bookstore/v1;bookstorev1";

service BookService {
  rpc CreateBook(CreateBookRequest) returns (Book);
  rpc GetBook(GetBookRequest) returns (Book);
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
  rpc UpdateBook(UpdateBookRequest) returns (Book);
  rpc DeleteBook(DeleteBookRequest) returns (DeleteBookResponse);
  rpc ReserveStock(ReserveStockRequest) returns (StockReservation);
  rpc CommitStock(CommitStockRequest) returns (StockReservation);
  rpc ReleaseStock(ReleaseStockRequest) returns (StockReservation);
}

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  int64 price_cents = 5;
  int32 stock = 6;
  string created_at = 7;
  string updated_at = 8;
  string seller_id = 9;
}

message CreateBookRequest {
  string title = 1;
  string author = 2;
  string isbn = 3;
  int64 price_cents = 4;
  int32 stock = 5;
  string seller_id = 6;
}

message GetBookRequest {
  string id = 1;
}

message ListBooksRequest {
  reserved 1, 2;
  reserved "page", "page_size";
  int32 limit = 3;
  string cursor = 4;
}

message ListBooksResponse {
  repeated Book books = 1;
  reserved 2;
  reserved "total";
  string next_cursor = 3;
  bool has_more = 4;
}

message UpdateBookRequest {
  string id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  int64 price_cents = 5;
  int32 stock = 6;
  string seller_id = 7;
}

message DeleteBookRequest {
  string id = 1;
}

message DeleteBookResponse {}

message StockReservation {
  string id = 1;
  string order_id = 2;
  string book_id = 3;
  int32 quantity = 4;
  string status = 5;
  string expires_at = 6;
}

message ReserveStockRequest {
  string order_id = 1;
  string book_id = 2;
  int32 quantity = 3;
  string idempotency_key = 4;
}

message CommitStockRequest {
  string order_id = 1;
  string book_id = 2;
}

message ReleaseStockRequest {
  string order_id = 1;
  string book_id = 2;
}
