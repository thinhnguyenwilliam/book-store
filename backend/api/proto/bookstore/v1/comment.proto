syntax = "proto3";

package bookstore.v1;

option go_package = "github.com/thinhnguyenwilliam/book-store/backend/gen/bookstore/v1;bookstorev1";

service CommentService {
  rpc CreateComment(CreateCommentRequest) returns (Comment);
  rpc ListBookComments(ListBookCommentsRequest) returns (ListCommentsResponse);
  rpc ListCommentReplies(ListCommentRepliesRequest) returns (ListCommentsResponse);
  rpc UpdateComment(UpdateCommentRequest) returns (Comment);
  rpc DeleteComment(DeleteCommentRequest) returns (Comment);
  rpc ModerateComment(ModerateCommentRequest) returns (Comment);
}

message Comment {
  string id = 1;
  string book_id = 2;
  string author_id = 3;
  string author_name = 4;
  string parent_id = 5;
  string root_id = 6;
  int32 depth = 7;
  string content = 8;
  string status = 9;
  int64 reply_count = 10;
  string created_at = 11;
  string updated_at = 12;
}

message CreateCommentRequest {
  string book_id = 1;
  string author_id = 2;
  string parent_id = 3;
  string content = 4;
}

message ListBookCommentsRequest {
  string book_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListCommentRepliesRequest {
  string root_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message UpdateCommentRequest {
  string id = 1;
  string author_id = 2;
  string content = 3;
}

message DeleteCommentRequest {
  string id = 1;
  string actor_id = 2;
  bool is_admin = 3;
}

message ModerateCommentRequest {
  string id = 1;
  string status = 2;
}
