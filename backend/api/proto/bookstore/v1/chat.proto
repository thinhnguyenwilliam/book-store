syntax = "proto3";

package bookstore.v1;

option go_package = "github.com/thinhnguyenwilliam/book-store/backend/gen/bookstore/v1;bookstorev1";

service ChatService {
  rpc CreateSupportConversation(CreateSupportConversationRequest) returns (Conversation);
  rpc GetConversation(GetConversationRequest) returns (Conversation);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc UpdateMessage(UpdateMessageRequest) returns (Message);
  rpc DeleteMessage(DeleteMessageRequest) returns (Message);
  rpc MarkConversationRead(MarkConversationReadRequest) returns (MarkConversationReadResponse);
  rpc GetUnreadChatCount(GetUnreadChatCountRequest) returns (GetUnreadChatCountResponse);
}

message Conversation {
  string id = 1;
  string customer_id = 2;
  string type = 3;
  string status = 4;
  int64 last_message_sequence = 5;
  string last_message_preview = 6;
  string last_message_at = 7;
  int64 unread_count = 8;
  string created_at = 9;
  string updated_at = 10;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string sender_name = 4;
  string client_message_id = 5;
  int64 sequence_number = 6;
  string content = 7;
  string message_type = 8;
  string created_at = 9;
  string edited_at = 10;
  string deleted_at = 11;
  repeated string audience_ids = 12;
  bool admin_audience = 13;
}

message CreateSupportConversationRequest {
  string customer_id = 1;
}

message GetConversationRequest {
  string conversation_id = 1;
  string user_id = 2;
  bool is_admin = 3;
}

message ListConversationsRequest {
  string user_id = 1;
  bool is_admin = 2;
  int32 limit = 3;
  string cursor = 4;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message ListMessagesRequest {
  string conversation_id = 1;
  string user_id = 2;
  bool is_admin = 3;
  int32 limit = 4;
  string cursor = 5;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message SendMessageRequest {
  string conversation_id = 1;
  string sender_id = 2;
  bool is_admin = 3;
  string client_message_id = 4;
  string content = 5;
}

message UpdateMessageRequest {
  string id = 1;
  string actor_id = 2;
  bool is_admin = 3;
  string content = 4;
}

message DeleteMessageRequest {
  string id = 1;
  string actor_id = 2;
  bool is_admin = 3;
}

message MarkConversationReadRequest {
  string conversation_id = 1;
  string user_id = 2;
  bool is_admin = 3;
  int64 sequence_number = 4;
}

message MarkConversationReadResponse {
  int64 last_read_sequence = 1;
}

message GetUnreadChatCountRequest {
  string user_id = 1;
  bool is_admin = 2;
}

message GetUnreadChatCountResponse {
  int64 count = 1;
}
