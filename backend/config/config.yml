gateway:
  http_address: ":8080"
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  refresh_cookie_name: "bookstore_refresh"
  refresh_cookie_secure: false
  refresh_cookie_same_site: "lax"

grpc:
  auth_address: "auth-service:50051"
  user_address: "user-service:50052"
  book_address: "book-service:50053"
  auth_listen_address: ":50051"
  user_listen_address: ":50052"
  book_listen_address: ":50053"

postgres:
  url: "postgres://bookstore:bookstore@postgres:5432/bookstore?sslmode=disable"

auth:
  jwt_secret: "local-development-secret-change-me-32"
  jwt_issuer: "book-store-auth"
  access_token_ttl: "5m"
  refresh_token_ttl: "168h"

redis:
  address: "redis:6379"
  password: ""
  database: 0

rabbitmq:
  url: "amqp://bookstore:bookstore@rabbitmq:5672/"
  exchange: "bookstore.events"
  user_profile_queue: "user.profile.create"
  account_registered_routing_key: "account.registered"
  consumer_name: "bookstore-user-profile-worker"
  consumer_concurrency: 10
  prefetch: 20

outbox:
  outbox_poll_interval: "2s"

shutdown:
  timeout: "12s"
