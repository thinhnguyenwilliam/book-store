gateway:
  http_address: ":8080"
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://localhost:5174"
  refresh_cookie_name: "bookstore_refresh"
  refresh_cookie_secure: false
  refresh_cookie_same_site: "lax"

grpc:
  auth_address: "localhost:50051"
  user_address: "localhost:50052"
  book_address: "localhost:50053"
  auth_listen_address: ":50051"
  user_listen_address: ":50052"
  book_listen_address: ":50053"

postgres:
  url: "postgres://bookstore:bookstore@localhost:5432/bookstore?sslmode=disable"

auth:
  jwt_secret: "local-development-secret-change-me-32"
  jwt_issuer: "book-store-auth"
  access_token_ttl: "5m"
  refresh_token_ttl: "168h"

redis:
  address: "localhost:6379"
  password: ""
  database: 0

rabbitmq:
  url: "amqp://bookstore:bookstore@localhost:5672/"
  exchange: "bookstore.events"
  user_profile_queue: "user.profile.create"
  account_registered_routing_key: "account.registered"
  account_deleted_routing_key: "account.deleted"
  consumer_name: "bookstore-user-profile-worker-local"
  consumer_concurrency: 10
  prefetch: 20

outbox:
  outbox_poll_interval: "2s"

shutdown:
  timeout: "12s"

logging:
  directory: "logs"
  level: "debug"
  format: "text"
  timezone: "Asia/Ho_Chi_Minh"
  also_stdout: true
