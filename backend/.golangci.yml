version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - sqlclosecheck
  exclusions:
    generated: strict
    presets:
      - comments

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
