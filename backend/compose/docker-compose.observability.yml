x-observability-defaults: &observability-defaults
  restart: unless-stopped
  networks: [backend]

services:
  alertmanager:
    <<: *observability-defaults
    image: quay.io/prometheus/alertmanager:v0.34.0
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ${ALERTMANAGER_CONFIG:-./observability/alertmanager.yml}:/etc/alertmanager/config.yml:ro
      - ./secrets/alertmanager:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager

  # Linux host CPU, memory and disks. Network collectors are disabled because
  # this exporter runs in Docker's bridge network namespace.
  node-exporter:
    <<: *observability-defaults
    image: quay.io/prometheus/node-exporter:v1.12.1
    pid: host
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.stat
      - --collector.uname
      - --collector.time
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /:/host:ro,rslave

  otel-storage-init:
    <<: *observability-defaults
    image: postgres:17-alpine
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - chown -R 10001:10001 /var/lib/otelcol-ingest /var/lib/otelcol-consumer
    volumes:
      - otel-collector-data:/var/lib/otelcol-ingest
      - otel-log-consumer-data:/var/lib/otelcol-consumer

  otel-collector:
    <<: *observability-defaults
    # Local log files are group-readable (0640); match the host developer GID.
    group_add: ["${LOCAL_LOG_GID:-1000}"]
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/config.yml"]
    depends_on:
      otel-storage-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      tempo: { condition: service_started }
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
      - app-logs:/var/log/bookstore/docker:ro
      - ./logs:/var/log/bookstore/local:ro
      - otel-collector-data:/var/lib/otelcol

  otel-log-consumer:
    <<: *observability-defaults
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/config.yml"]
    depends_on:
      otel-storage-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      loki: { condition: service_started }
    volumes:
      - ./observability/otel-log-consumer.yml:/etc/otelcol/config.yml:ro
      - otel-log-consumer-data:/var/lib/otelcol

  tempo:
    <<: *observability-defaults
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo/config.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo

  prometheus:
    <<: *observability-defaults
    image: quay.io/prometheus/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector: { condition: service_started }
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
      - prometheus-data:/prometheus

  loki:
    <<: *observability-defaults
    image: grafana/loki:3.7.3
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  grafana:
    <<: *observability-defaults
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      tempo: { condition: service_started }
      prometheus: { condition: service_started }
      loki: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
