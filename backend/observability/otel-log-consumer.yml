extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true

receivers:
  kafka/logs:
    brokers: [kafka:29092]
    client_id: bookstore-otel-log-consumer
    group_id: bookstore-loki-log-v1
    initial_offset: earliest
    logs:
      topics: [bookstore.application-logs]
      encoding: otlp_proto

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000

service:
  extensions: [health_check, file_storage]
  pipelines:
    logs:
      receivers: [kafka/logs]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
