basePath: /
definitions:
  http.AddCartItemRequest:
    properties:
      bookId:
        format: uuid
        type: string
      quantity:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  http.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 3600
        type: integer
      token_type:
        example: Bearer
        type: string
      user_id:
        format: uuid
        type: string
    type: object
  http.BatchCartItemRequest:
    properties:
      itemId:
        format: uuid
        type: string
    type: object
  http.BookListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.BookResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.BookRequest:
    properties:
      author:
        example: Robert C. Martin
        type: string
      isbn:
        example: "9780134494166"
        type: string
      price_cents:
        example: 3999
        type: integer
      seller_id:
        format: uuid
        type: string
      stock:
        example: 10
        type: integer
      title:
        example: Clean Architecture
        type: string
    type: object
  http.BookResponse:
    properties:
      author:
        example: Robert C. Martin
        type: string
      created_at:
        format: date-time
        type: string
      id:
        format: uuid
        type: string
      isbn:
        example: "9780134494166"
        type: string
      price_cents:
        example: 3999
        type: integer
      seller_id:
        format: uuid
        type: string
      stock:
        example: 10
        type: integer
      title:
        example: Clean Architecture
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  http.CartItemResponse:
    properties:
      book_id:
        format: uuid
        type: string
      created_at:
        format: date-time
        type: string
      id:
        format: uuid
        type: string
      quantity:
        type: integer
      updated_at:
        format: date-time
        type: string
    type: object
  http.CartListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.CartItemResponse'
        type: array
    type: object
  http.CreatePaymentRequest:
    properties:
      bankCode:
        type: string
      locale:
        enum:
        - vn
        - en
        type: string
      orderId:
        format: uuid
        type: string
      provider:
        enum:
        - wallet
        - vnpay
        type: string
    type: object
  http.CursorPagination:
    properties:
      has_more:
        example: true
        type: boolean
      next_cursor:
        type: string
    type: object
  http.CustomerListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.DeletionAcceptedResponse:
    properties:
      status:
        example: accepted
        type: string
    type: object
  http.ErrorDetail:
    properties:
      code:
        example: invalid_provider_credential
        type: string
      message:
        example: invalid request
        type: string
      provider:
        example: google
        type: string
      retryable:
        type: boolean
    type: object
  http.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/http.ErrorDetail'
    type: object
  http.FacebookLoginRequest:
    properties:
      access_token:
        type: string
      create_account:
        type: boolean
      state:
        type: string
    type: object
  http.GoogleLoginRequest:
    properties:
      create_account:
        type: boolean
      credential:
        type: string
      state:
        type: string
    type: object
  http.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        example: reader@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  http.OrderItemResponse:
    properties:
      book_id:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
      quantity:
        type: integer
      seller_id:
        type: string
      subtotal_cents:
        type: integer
      title:
        type: string
      unit_price_cents:
        type: integer
    type: object
  http.OrderListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.OrderResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.OrderResponse:
    properties:
      created_at:
        format: date-time
        type: string
      currency:
        type: string
      failure_reason:
        type: string
      id:
        format: uuid
        type: string
      items:
        items:
          $ref: '#/definitions/http.OrderItemResponse'
        type: array
      payment_id:
        format: uuid
        type: string
      reservation_expires_at:
        format: date-time
        type: string
      status:
        type: string
      total_cents:
        type: integer
      updated_at:
        format: date-time
        type: string
    type: object
  http.PaymentResponse:
    properties:
      amount_cents:
        type: integer
      checkout_url:
        type: string
      created_at:
        format: date-time
        type: string
      currency:
        type: string
      expires_at:
        format: date-time
        type: string
      failure_reason:
        type: string
      id:
        format: uuid
        type: string
      order_id:
        format: uuid
        type: string
      paid_at:
        format: date-time
        type: string
      platform_fee_cents:
        type: integer
      provider:
        type: string
      provider_transaction_id:
        type: string
      status:
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  http.ProviderStateRequest:
    properties:
      create_account:
        type: boolean
      provider:
        example: google
        type: string
    type: object
  http.ProviderStateResponse:
    properties:
      expires_in:
        example: 600
        type: integer
      state:
        type: string
    type: object
  http.RegisterRequest:
    properties:
      display_name:
        example: Reader
        type: string
      email:
        example: reader@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  http.UpdateCartItemRequest:
    properties:
      quantity:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  http.UpdateProfileRequest:
    properties:
      display_name:
        example: Reader Nguyen
        type: string
    type: object
  http.UpdateWalletBalanceRequest:
    properties:
      delta_cents:
        type: integer
      reason:
        type: string
    type: object
  http.UserResponse:
    properties:
      created_at:
        format: date-time
        type: string
      display_name:
        example: Reader
        type: string
      email:
        example: reader@example.com
        type: string
      id:
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  http.VNPayWebhookResponse:
    properties:
      Message:
        type: string
      RspCode:
        type: string
    type: object
  http.WalletResponse:
    properties:
      balance_cents:
        type: integer
      created_at:
        format: date-time
        type: string
      currency:
        type: string
      id:
        format: uuid
        type: string
      owner_id:
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
info:
  contact: {}
  description: Public HTTP API exposed by the Book Store API Gateway.
  title: Book Store API
  version: "1.0"
paths:
  /api/v1/admin/books:
    post:
      consumes:
      - application/json
      description: Creates a book. The bearer token must contain the admin role.
      parameters:
      - description: Book payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.BookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a book
      tags:
      - Admin Books
  /api/v1/admin/books/{id}:
    delete:
      description: Deletes a book. The bearer token must contain the admin role.
      parameters:
      - description: Book ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a book
      tags:
      - Admin Books
    put:
      consumes:
      - application/json
      description: Updates a book. The bearer token must contain the admin role.
      parameters:
      - description: Book ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Book payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.BookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a book
      tags:
      - Admin Books
  /api/v1/admin/customers:
    get:
      description: Returns user profiles using cursor pagination. The bearer token
        must contain the admin role.
      parameters:
      - default: 20
        description: Items per request
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor returned by the previous request
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CustomerListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List customers
      tags:
      - Admin Customers
  /api/v1/admin/customers/{id}:
    delete:
      description: Deletes the auth account transactionally and queues asynchronous
        profile deletion through the outbox. The bearer token must contain the admin
        role.
      parameters:
      - description: Customer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.DeletionAcceptedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a customer account
      tags:
      - Admin Customers
    get:
      description: Returns one user profile by ID. The bearer token must contain the
        admin role.
      parameters:
      - description: Customer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a customer
      tags:
      - Admin Customers
    put:
      consumes:
      - application/json
      description: Updates a customer's display name. The bearer token must contain
        the admin role.
      parameters:
      - description: Customer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Customer profile payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a customer
      tags:
      - Admin Customers
  /api/v1/admin/wallets/{owner_id}/balance:
    put:
      consumes:
      - application/json
      description: Administrative funding/testing endpoint. It never directly overwrites
        the stored balance.
      parameters:
      - description: Wallet owner ID
        in: path
        name: owner_id
        required: true
        type: string
      - description: Unique retry key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Signed balance delta
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.UpdateWalletBalanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.WalletResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Adjust a wallet balance through double-entry ledger records
      tags:
      - Admin Wallets
  /api/v1/auth/facebook:
    post:
      consumes:
      - application/json
      description: Validates a Facebook user access token against the configured Meta
        app. Storefront clients may request account creation; admin clients should
        only sign in existing accounts.
      parameters:
      - description: Facebook user access token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.FacebookLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Sign in with Facebook
      tags:
      - Auth
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      description: Verifies a Google Identity Services ID token. Storefront clients
        may request account creation; admin clients should only sign in existing accounts.
      parameters:
      - description: Google credential
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Sign in with Google
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an account and returns a bearer access token.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes the current refresh session and clears its HttpOnly cookie.
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Log out
      tags:
      - Auth
  /api/v1/auth/provider-state:
    post:
      consumes:
      - application/json
      description: Issues a short-lived state value and matching HttpOnly cookie for
        Google or Facebook login CSRF protection.
      parameters:
      - description: External login transaction
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ProviderStateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProviderStateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Start an external login transaction
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Rotates the HttpOnly refresh cookie and returns a new short-lived
        access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Refresh an access token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates an auth account and schedules profile creation through
        the transactional outbox.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Register an account
      tags:
      - Auth
  /api/v1/books:
    get:
      description: Returns a paginated list of books.
      parameters:
      - default: 20
        description: Items per request
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor returned by the previous request
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.BookListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List books
      tags:
      - Books
  /api/v1/books/{id}:
    get:
      description: Returns one book by ID.
      parameters:
      - description: Book ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.BookResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get a book
      tags:
      - Books
  /api/v1/cart/items:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CartListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List current cart items
      tags:
      - Cart
    post:
      consumes:
      - application/json
      parameters:
      - description: Cart item
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.AddCartItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
