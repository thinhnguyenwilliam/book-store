basePath: /
definitions:
  http.AddCartItemRequest:
    properties:
      bookId:
        format: uuid
        type: string
      quantity:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  http.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 3600
        type: integer
      token_type:
        example: Bearer
        type: string
      user_id:
        format: uuid
        type: string
    type: object
  http.BatchCartItemRequest:
    properties:
      itemId:
        format: uuid
        type: string
    type: object
  http.BookActivityListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.BookActivityMetricResponse'
        type: array
    type: object
  http.BookActivityMetricResponse:
    properties:
      book_id:
        format: uuid
        type: string
      cart_adds:
        type: integer
      comments:
        type: integer
      score:
        type: number
      views:
        type: integer
    type: object
  http.BookListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.BookResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.BookRequest:
    properties:
      author:
        example: Robert C. Martin
        type: string
      isbn:
        example: "9780134494166"
        type: string
      price_cents:
        example: 3999
        type: integer
      seller_id:
        format: uuid
        type: string
      stock:
        example: 10
        type: integer
      title:
        example: Clean Architecture
        type: string
    type: object
  http.BookResponse:
    properties:
      author:
        example: Robert C. Martin
        type: string
      created_at:
        format: date-time
        type: string
      id:
        format: uuid
        type: string
      isbn:
        example: "9780134494166"
        type: string
      price_cents:
        example: 3999
        type: integer
      seller_id:
        format: uuid
        type: string
      stock:
        example: 10
        type: integer
      title:
        example: Clean Architecture
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  http.BookSearchHitResponse:
    properties:
      book:
        $ref: '#/definitions/http.BookResponse'
      highlights:
        additionalProperties:
          type: string
        type: object
      score:
        type: number
    type: object
  http.BookSearchResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.BookSearchHitResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
      took_ms:
        type: integer
      total:
        type: integer
    type: object
  http.BookSuggestionResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.BookSearchHitResponse'
        type: array
      took_ms:
        type: integer
    type: object
  http.CartItemResponse:
    properties:
      book_id:
        format: uuid
        type: string
      created_at:
        format: date-time
        type: string
      id:
        format: uuid
        type: string
      quantity:
        type: integer
      updated_at:
        format: date-time
        type: string
    type: object
  http.CartListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.CartItemResponse'
        type: array
    type: object
  http.ChatMessageListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.ChatMessageResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.ChatMessageRequest:
    properties:
      client_message_id:
        type: string
      content:
        type: string
    type: object
  http.ChatMessageResponse:
    properties:
      client_message_id:
        type: string
      content:
        type: string
      conversation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      edited_at:
        type: string
      id:
        type: string
      message_type:
        type: string
      sender_id:
        type: string
      sender_name:
        type: string
      sequence_number:
        type: integer
    type: object
  http.ChatMessageUpdateRequest:
    properties:
      content:
        type: string
    type: object
  http.ChatReadRequest:
    properties:
      sequence_number:
        type: integer
    type: object
  http.CommentListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.CommentResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.CommentRequest:
    properties:
      content:
        type: string
      parent_id:
        type: string
    type: object
  http.CommentResponse:
    properties:
      author_id:
        type: string
      author_name:
        type: string
      book_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      depth:
        type: integer
      id:
        type: string
      parent_id:
        type: string
      reply_count:
        type: integer
      root_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  http.ConversationListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.ConversationResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.ConversationResponse:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      id:
        type: string
      last_message_at:
        type: string
      last_message_preview:
        type: string
      last_message_sequence:
        type: integer
      status:
        type: string
      type:
        type: string
      unread_count:
        type: integer
      updated_at:
        type: string
    type: object
  http.CreatePaymentRequest:
    properties:
      bankCode:
        type: string
      locale:
        enum:
        - vn
        - en
        type: string
      orderId:
        format: uuid
        type: string
      provider:
        enum:
        - wallet
        - vnpay
        type: string
    type: object
  http.CursorPagination:
    properties:
      has_more:
        example: true
        type: boolean
      next_cursor:
        type: string
    type: object
  http.CustomerActivityAcceptedResponse:
    properties:
      event_id:
        format: uuid
        type: string
      status:
        example: accepted
        type: string
    type: object
  http.CustomerActivityAnalyticsResponse:
    properties:
      abandoned_carts:
        type: integer
      cart_to_checkout_rate:
        type: number
      checkout_to_order_rate:
        type: number
      event_counts:
        items:
          $ref: '#/definitions/http.EventCountResponse'
        type: array
      from:
        format: date-time
        type: string
      last_event_at:
        format: date-time
        type: string
      to:
        format: date-time
        type: string
      top_books:
        items:
          $ref: '#/definitions/http.BookActivityMetricResponse'
        type: array
      total_events:
        type: integer
      unique_actors:
        type: integer
      view_to_cart_rate:
        type: number
    type: object
  http.CustomerActivityRequest:
    properties:
      anonymous_id:
        format: uuid
        type: string
      book_id:
        format: uuid
        type: string
      event_type:
        enum:
        - book.viewed
        - book.searched
        - book.added_to_cart
        - book.removed_from_cart
        - checkout.started
        type: string
      quantity:
        maximum: 100
        minimum: 1
        type: integer
      query:
        maxLength: 200
        type: string
      session_id:
        format: uuid
        type: string
    type: object
  http.CustomerListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.DailyOrderMetricResponse:
    properties:
      cancelled:
        type: integer
      confirmed:
        type: integer
      created:
        type: integer
      date:
        example: "2026-09-01"
        type: string
    type: object
  http.DeletionAcceptedResponse:
    properties:
      status:
        example: accepted
        type: string
    type: object
  http.ErrorDetail:
    properties:
      code:
        example: invalid_provider_credential
        type: string
      message:
        example: invalid request
        type: string
      provider:
        example: google
        type: string
      retryable:
        type: boolean
    type: object
  http.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/http.ErrorDetail'
    type: object
  http.EventCountResponse:
    properties:
      count:
        type: integer
      event_type:
        type: string
    type: object
  http.FacebookLoginRequest:
    properties:
      access_token:
        type: string
      create_account:
        type: boolean
      state:
        type: string
    type: object
  http.GoogleLoginRequest:
    properties:
      create_account:
        type: boolean
      credential:
        type: string
      state:
        type: string
    type: object
  http.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        example: reader@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  http.MarkAllReadResponse:
    properties:
      updated:
        type: integer
    type: object
  http.ModerateCommentRequest:
    properties:
      status:
        type: string
    type: object
  http.NotificationListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.NotificationResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.NotificationResponse:
    properties:
      body:
        type: string
      created_at:
        type: string
      data:
        additionalProperties: {}
        type: object
      id:
        type: string
      read_at:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  http.OrderAnalyticsResponse:
    properties:
      average_confirmation_seconds:
        type: number
      cancelled_orders:
        type: integer
      confirmed_orders:
        type: integer
      daily:
        items:
          $ref: '#/definitions/http.DailyOrderMetricResponse'
        type: array
      from:
        format: date-time
        type: string
      last_event_at:
        format: date-time
        type: string
      payment_attempts:
        type: integer
      payment_failed:
        type: integer
      payment_succeeded:
        type: integer
      payment_success_rate:
        type: number
      stock_reservation_failed:
        type: integer
      to:
        format: date-time
        type: string
      total_orders:
        type: integer
    type: object
  http.OrderItemResponse:
    properties:
      book_id:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
      quantity:
        type: integer
      seller_id:
        type: string
      subtotal_cents:
        type: integer
      title:
        type: string
      unit_price_cents:
        type: integer
    type: object
  http.OrderListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.OrderResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.OrderResponse:
    properties:
      created_at:
        format: date-time
        type: string
      currency:
        type: string
      failure_reason:
        type: string
      id:
        format: uuid
        type: string
      items:
        items:
          $ref: '#/definitions/http.OrderItemResponse'
        type: array
      payment_id:
        format: uuid
        type: string
      reservation_expires_at:
        format: date-time
        type: string
      status:
        type: string
      total_cents:
        type: integer
      updated_at:
        format: date-time
        type: string
    type: object
  http.PaymentResponse:
    properties:
      amount_cents:
        type: integer
      checkout_url:
        type: string
      created_at:
        format: date-time
        type: string
      currency:
        type: string
      expires_at:
        format: date-time
        type: string
      failure_reason:
        type: string
      id:
        format: uuid
        type: string
      order_id:
        format: uuid
        type: string
      paid_at:
        format: date-time
        type: string
      platform_fee_cents:
        type: integer
      provider:
        type: string
      provider_transaction_id:
        type: string
      status:
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  http.ProviderStateRequest:
    properties:
      create_account:
        type: boolean
      provider:
        example: google
        type: string
    type: object
  http.ProviderStateResponse:
    properties:
      expires_in:
        example: 600
        type: integer
      state:
        type: string
    type: object
  http.PushDeviceRequest:
    properties:
      application:
        type: string
      device_id:
        type: string
      platform:
        type: string
      registration_token:
        type: string
    required:
    - application
    - device_id
    - platform
    - registration_token
    type: object
  http.PushDeviceResponse:
    properties:
      application:
        type: string
      created_at:
        type: string
      device_id:
        type: string
      id:
        type: string
      last_seen_at:
        type: string
      platform:
        type: string
      updated_at:
        type: string
    type: object
  http.RegisterRequest:
    properties:
      display_name:
        example: Reader
        type: string
      email:
        example: reader@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  http.RelatedBookListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.RelatedBookResponse'
        type: array
    type: object
  http.RelatedBookResponse:
    properties:
      book_id:
        format: uuid
        type: string
      score:
        type: number
      shared_actors:
        type: integer
    type: object
  http.UnreadCountResponse:
    properties:
      count:
        type: integer
    type: object
  http.UpdateCartItemRequest:
    properties:
      quantity:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  http.UpdateCommentRequest:
    properties:
      content:
        type: string
    type: object
  http.UpdateProfileRequest:
    properties:
      display_name:
        example: Reader Nguyen
        type: string
    type: object
  http.UpdateWalletBalanceRequest:
    properties:
      delta_cents:
        type: integer
      reason:
        type: string
    type: object
  http.UserResponse:
    properties:
      created_at:
        format: date-time
        type: string
      display_name:
        example: Reader
        type: string
      email:
        example: reader@example.com
        type: string
      id:
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  http.VNPayWebhookResponse:
    properties:
      Message:
        type: string
      RspCode:
        type: string
    type: object
  http.WalletResponse:
    properties:
      balance_cents:
        type: integer
      created_at:
        format: date-time
        type: string
      currency:
        type: string
      id:
        format: uuid
        type: string
      owner_id:
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
info:
  contact: {}
  description: Public HTTP API exposed by the Book Store API Gateway.
  title: Book Store API
  version: "1.0"
paths:
  /api/v1/admin/analytics/customer-activity:
    get:
      description: Returns Kafka-backed event counts, conversion funnel, cart abandonment
        and trending books. Data is eventually consistent.
      parameters:
      - description: Inclusive start
        in: query
        name: from
        type: string
      - description: Inclusive calendar end, or exclusive RFC3339 end
        in: query
        name: to
        type: string
      - default: 10
        description: Number of top books
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CustomerActivityAnalyticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get customer behavior analytics
      tags:
      - Admin Analytics
  /api/v1/admin/analytics/orders:
    get:
      description: Returns the Kafka-backed order read model. Dates accept RFC3339
        or YYYY-MM-DD; an omitted range defaults to the last 30 days. Data is eventually
        consistent.
      parameters:
      - description: Inclusive start
        in: query
        name: from
        type: string
      - description: Inclusive calendar end, or exclusive RFC3339 end
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.OrderAnalyticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get order lifecycle analytics
      tags:
      - Admin Analytics
  /api/v1/admin/books:
    post:
      consumes:
      - application/json
      description: Creates a book. The bearer token must contain the admin role.
      parameters:
      - description: Book payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.BookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a book
      tags:
      - Admin Books
  /api/v1/admin/books/{id}:
    delete:
      description: Deletes a book. The bearer token must contain the admin role.
      parameters:
      - description: Book ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a book
      tags:
      - Admin Books
    put:
      consumes:
      - application/json
      description: Updates a book. The bearer token must contain the admin role.
      parameters:
      - description: Book ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Book payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.BookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a book
      tags:
      - Admin Books
  /api/v1/admin/comments/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: published or hidden
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ModerateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CommentResponse'
      security:
      - BearerAuth: []
      summary: Hide or publish a comment
      tags:
      - Admin
      - Comments
  /api/v1/admin/customers:
    get:
      description: Returns user profiles using cursor pagination. The bearer token
        must contain the admin role.
      parameters:
      - default: 20
        description: Items per request
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor returned by the previous request
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CustomerListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List customers
      tags:
      - Admin Customers
  /api/v1/admin/customers/{id}:
    delete:
      description: Deletes the auth account transactionally and queues asynchronous
        profile deletion through the outbox. The bearer token must contain the admin
        role.
      parameters:
      - description: Customer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.DeletionAcceptedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a customer account
      tags:
      - Admin Customers
    get:
      description: Returns one user profile by ID. The bearer token must contain the
        admin role.
      parameters:
      - description: Customer ID
