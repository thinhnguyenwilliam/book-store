basePath: /
definitions:
  http.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 3600
        type: integer
      token_type:
        example: Bearer
        type: string
      user_id:
        format: uuid
        type: string
    type: object
  http.BookListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.BookResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.BookRequest:
    properties:
      author:
        example: Robert C. Martin
        type: string
      isbn:
        example: "9780134494166"
        type: string
      price_cents:
        example: 3999
        type: integer
      stock:
        example: 10
        type: integer
      title:
        example: Clean Architecture
        type: string
    type: object
  http.BookResponse:
    properties:
      author:
        example: Robert C. Martin
        type: string
      created_at:
        format: date-time
        type: string
      id:
        format: uuid
        type: string
      isbn:
        example: "9780134494166"
        type: string
      price_cents:
        example: 3999
        type: integer
      stock:
        example: 10
        type: integer
      title:
        example: Clean Architecture
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  http.CursorPagination:
    properties:
      has_more:
        example: true
        type: boolean
      next_cursor:
        type: string
    type: object
  http.CustomerListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.CursorPagination'
    type: object
  http.DeletionAcceptedResponse:
    properties:
      status:
        example: accepted
        type: string
    type: object
  http.ErrorDetail:
    properties:
      message:
        example: invalid request
        type: string
    type: object
  http.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/http.ErrorDetail'
    type: object
  http.FacebookLoginRequest:
    properties:
      access_token:
        type: string
      create_account:
        type: boolean
    type: object
  http.GoogleLoginRequest:
    properties:
      create_account:
        type: boolean
      credential:
        type: string
    type: object
  http.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        example: reader@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  http.RegisterRequest:
    properties:
      display_name:
        example: Reader
        type: string
      email:
        example: reader@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  http.UpdateProfileRequest:
    properties:
      display_name:
        example: Reader Nguyen
        type: string
    type: object
  http.UserResponse:
    properties:
      created_at:
        format: date-time
        type: string
      display_name:
        example: Reader
        type: string
      email:
        example: reader@example.com
        type: string
      id:
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
info:
  contact: {}
  description: Public HTTP API exposed by the Book Store API Gateway.
  title: Book Store API
  version: "1.0"
paths:
  /api/v1/admin/books:
    post:
      consumes:
      - application/json
      description: Creates a book. The bearer token must contain the admin role.
      parameters:
      - description: Book payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.BookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a book
      tags:
      - Admin Books
  /api/v1/admin/books/{id}:
    delete:
      description: Deletes a book. The bearer token must contain the admin role.
      parameters:
      - description: Book ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a book
      tags:
      - Admin Books
    put:
      consumes:
      - application/json
      description: Updates a book. The bearer token must contain the admin role.
      parameters:
      - description: Book ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Book payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.BookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a book
      tags:
      - Admin Books
  /api/v1/admin/customers:
    get:
      description: Returns user profiles using cursor pagination. The bearer token
        must contain the admin role.
      parameters:
      - default: 20
        description: Items per request
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor returned by the previous request
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CustomerListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List customers
      tags:
      - Admin Customers
  /api/v1/admin/customers/{id}:
    delete:
      description: Deletes the auth account transactionally and queues asynchronous
        profile deletion through the outbox. The bearer token must contain the admin
        role.
      parameters:
      - description: Customer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.DeletionAcceptedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a customer account
      tags:
      - Admin Customers
    get:
      description: Returns one user profile by ID. The bearer token must contain the
        admin role.
      parameters:
      - description: Customer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a customer
      tags:
      - Admin Customers
    put:
      consumes:
      - application/json
      description: Updates a customer's display name. The bearer token must contain
        the admin role.
      parameters:
      - description: Customer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Customer profile payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a customer
      tags:
      - Admin Customers
  /api/v1/auth/facebook:
    post:
      consumes:
      - application/json
      description: Validates a Facebook user access token against the configured Meta
        app. Storefront clients may request account creation; admin clients should
        only sign in existing accounts.
      parameters:
      - description: Facebook user access token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.FacebookLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Sign in with Facebook
      tags:
      - Auth
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      description: Verifies a Google Identity Services ID token. Storefront clients
        may request account creation; admin clients should only sign in existing accounts.
      parameters:
      - description: Google credential
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Sign in with Google
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an account and returns a bearer access token.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes the current refresh session and clears its HttpOnly cookie.
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Log out
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Rotates the HttpOnly refresh cookie and returns a new short-lived
        access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Refresh an access token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates an auth account and schedules profile creation through
        the transactional outbox.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Register an account
      tags:
      - Auth
  /api/v1/books:
    get:
      description: Returns a paginated list of books.
      parameters:
      - default: 20
        description: Items per request
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor returned by the previous request
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.BookListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List books
      tags:
      - Books
  /api/v1/books/{id}:
    get:
      description: Returns one book by ID.
      parameters:
      - description: Book ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.BookResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get a book
      tags:
      - Books
  /api/v1/users/me:
    get:
      description: Returns the profile associated with the bearer token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates the display name of the profile associated with the bearer
        token.
      parameters:
      - description: Profile payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current profile
      tags:
      - Users
  /healthz:
    get:
      description: Returns the current health status of the HTTP gateway.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.HealthResponse'
      summary: Check gateway health
      tags:
      - System
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Enter the token using the format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
