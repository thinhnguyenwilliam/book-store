name: bookstore

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - backend

x-app-defaults: &app-defaults
  <<: *service-defaults
  command: ["-config", "/app/config.yml"]
  stop_grace_period: 15s
  volumes:
    - ./config/config.yml:/app/config.yml:ro
    - app-logs:/app/logs

services:
  gateway:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: gateway
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      book-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      comment-service:
        condition: service_started
      chat-service:
        condition: service_started
      search-service:
        condition: service_started
      redis:
        condition: service_healthy

  auth-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: auth-service
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: user-service
    depends_on:
      postgres:
        condition: service_healthy

  book-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: book-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  search-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: search-service
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      book-service:
        condition: service_started

  payment-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: payment-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: order-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      book-service:
        condition: service_started
      payment-service:
        condition: service_started

  worker-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: worker-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started

  notification-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: notification-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      mailpit:
        condition: service_started

  comment-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: comment-service
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      book-service:
        condition: service_started

  chat-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: chat-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started

  analytics-service:
    <<: *app-defaults
    build:
      context: .
      args:
        SERVICE: analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  pgadmin:
    <<: *service-defaults
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookstore.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  redis:
    <<: *service-defaults
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bookstore
      RABBITMQ_DEFAULT_PASS: bookstore
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  kafka:
    <<: *service-defaults
    image: apache/kafka:4.3.1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:9093,HOST://:9092,BROKER://:29092"
      KAFKA_ADVERTISED_LISTENERS: "HOST://localhost:9092,BROKER://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,BROKER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "BROKER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka-volume-init:
    <<: *service-defaults
    restart: "no"
    image: apache/kafka:4.3.1
    user: "0:0"
    command: ["/bin/bash", "-ec", "chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka-init:
    <<: *service-defaults
    restart: "no"
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic bookstore.order-events --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic bookstore.order-events.dlq --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic bookstore.customer-activity --partitions 12 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic bookstore.customer-activity.dlq --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic bookstore.catalog-events --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic bookstore.catalog-events.dlq --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics --entity-name bookstore.customer-activity --add-config cleanup.policy=delete,retention.ms=7776000000
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics --entity-name bookstore.customer-activity.dlq --add-config cleanup.policy=delete,retention.ms=2592000000
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics --entity-name bookstore.catalog-events --add-config 'cleanup.policy=[compact,delete],retention.ms=7776000000,min.cleanable.dirty.ratio=0.1'
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics --entity-name bookstore.catalog-events.dlq --add-config cleanup.policy=delete,retention.ms=2592000000

  elasticsearch:
    <<: *service-defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      xpack.security.autoconfiguration.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kafka-ui:
    <<: *service-defaults
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "bookstore-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
      SWAGGER_UI_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    <<: *service-defaults
    # GHCR is the upstream registry and avoids Docker Hub TLS/rate-limit issues.
    image: ghcr.io/axllent/mailpit:v1.31.0
    ports:
      - "1025:1025"
      - "8025:8025"

  redisinsight:
    <<: *service-defaults
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight-data:/data

networks:
  backend:

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
  redisinsight-data:
  rabbitmq-data:
  kafka-data:
  elasticsearch-data:
  app-logs:
